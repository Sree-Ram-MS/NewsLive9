<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live News Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --primary: #e50914;
            --secondary: #333333;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Top Navigation & Controls */
        header {
            position: sticky;
            top: 0;
            background-color: #000000;
            padding: 15px 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-bottom: 2px solid var(--secondary);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.5rem; }

        .btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover { background-color: #555; }
        .btn-mute-all { background-color: var(--primary); }
        .btn-mute-all:hover { background-color: #b80710; }
        .btn-active { background-color: #28a745; }

        /* Links List */
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Grid Layout */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .video-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            padding-bottom: 10px;
            scroll-margin-top: 150px; /* Ensures header doesn't cover video when scrolling */
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px 0 15px;
        }

        .video-title {
            margin: 0;
            font-size: 1rem;
            font-weight: 600;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .video-grid {
                grid-template-columns: 1fr; /* 1x9 Grid on mobile */
            }
            .header-top {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>Live News Dashboard</h1>
            <button class="btn btn-mute-all" onclick="muteAll()">🔇 Mute All Audio</button>
        </div>
        <div class="nav-links" id="nav-links">
            <!-- Navigation links will be injected here via JS -->
        </div>
    </header>

    <div class="video-grid" id="video-grid">
        <!-- Videos will be injected here via JS -->
    </div>

    <!-- Load YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Extracted YouTube Video IDs from your provided URLs
         const videos = [

        { id: "-8d8-c0yvyU", label: "Meadia One" },

        { id: "20VYE0oC_TM", label: "Reporter News" },

        { id: "WxgcelW2ue0", label: "Manorama News" },

        { id: "vLHiPiL11LU", label: "Asianet News" },

        { id: "FxeSfTclcY0", label: "24 News" },

        { id: "YGEgelAiUf0", label: "Mathrubhumi News" },

        { id: "DuVzAfPnEaY", label: "Janam TV" },

        { id: "3UhHeND0qpk", label: "Money Control" },

        { id: "Ctb_aUMffNg", label: "Polimar TV" },

    ];



        let players = [];

        // 1. Build the HTML structure dynamically
        function initUI() {
            const grid = document.getElementById('video-grid');
            const nav = document.getElementById('nav-links');

            videos.forEach((vid, index) => {
                // Build Navigation Button
                const navBtn = document.createElement('button');
                navBtn.className = 'btn';
                navBtn.id = `nav-btn-${index}`;
                navBtn.innerHTML = `Go to & Listen: ${vid.label}`;
                navBtn.onclick = () => focusVideo(index);
                nav.appendChild(navBtn);

                // Build Video Card
                const card = document.createElement('div');
                card.className = 'video-card';
                card.id = `card-${index}`;
                
                card.innerHTML = `
                    <div class="video-container">
                        <div id="player-${index}"></div>
                    </div>
                    <div class="video-controls">
                        <p class="video-title">${vid.label}</p>
                        <button class="btn" id="audio-btn-${index}" onclick="playAudioOnly(${index})">🔊 Listen</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 2. YouTube API initialized
        function onYouTubeIframeAPIReady() {
            videos.forEach((vid, index) => {
                players[index] = new YT.Player(`player-${index}`, {
                    videoId: vid.id,
                    playerVars: {
                        'autoplay': 1,
                        'mute': 1,        // MUST be muted to autoplay in modern browsers
                        'playsinline': 1, // Crucial for mobile viewing
                        'controls': 1
                    }
                });
            });
        }

        // 3. Logic to play audio for ONE video, mute the rest
        function playAudioOnly(activeIndex) {
            players.forEach((player, index) => {
                const btn = document.getElementById(`audio-btn-${index}`);
                const navBtn = document.getElementById(`nav-btn-${index}`);
                
                if (index === activeIndex) {
                    player.unMute();
                    btn.classList.add('btn-active');
                    btn.innerHTML = '🔊 Listening';
                    navBtn.style.border = "2px solid #28a745";
                } else {
                    player.mute();
                    btn.classList.remove('btn-active');
                    btn.innerHTML = '🔊 Listen';
                    navBtn.style.border = "none";
                }
            });
        }

        // 4. Mute all function
        function muteAll() {
            players.forEach((player, index) => {
                player.mute();
                const btn = document.getElementById(`audio-btn-${index}`);
                const navBtn = document.getElementById(`nav-btn-${index}`);
                btn.classList.remove('btn-active');
                btn.innerHTML = '🔊 Listen';
                navBtn.style.border = "none";
            });
        }

        // 5. Scroll to video and play its audio (For mobile nav links)
        function focusVideo(index) {
            document.getElementById(`card-${index}`).scrollIntoView({ behavior: 'smooth' });
            playAudioOnly(index);
        }

        // Run setup
        initUI();
    </script>
</body>
</html>
